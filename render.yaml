# Render Blueprint — provisions the web service and its Postgres together.
#
#   Render dashboard -> New -> Blueprint -> pick this repo.
#
# DATABASE_URL and AUTH_SECRET are filled in automatically. The three marked
# `sync: false` must be set by hand in the dashboard, because they are secrets
# or are only known once the service has a URL.

databases:
  - name: submithub-db
    databaseName: submithub
    user: submithub
    plan: free
    # Must match the web service: Render's internal database hostname only
    # resolves within a single region.
    region: singapore

services:
  - type: web
    name: submithub
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    # Migrations run at start, not at build: Render's build environment cannot
    # reach the internal database hostname — only the running service can.
    # `migrate deploy` applies pending migrations only and never resets data.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /signin
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: submithub-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # The instance has 512 MB. Left to itself V8 grows the heap until the
      # box is gone; capping it makes collection happen early enough that a
      # merge of a whole class fits. Measured peak drops by roughly 60 MB.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
      # Server-rendered dates (due dates, submission times) use the server's
      # timezone. Without this they render in UTC and a 23:59 IST deadline
      # shows as 18:29 to the class.
      - key: TZ
        value: Asia/Kolkata
      # Set these in the Render dashboard:
      #   AUTH_URL             https://<your-service>.onrender.com
      #   GOOGLE_CLIENT_ID     from Google Cloud
      #   GOOGLE_CLIENT_SECRET from Google Cloud
      - key: AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
